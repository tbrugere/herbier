name: android
# Signed release APK (scripts/release.sh) on a v* tag, attached to a GitHub
# release; a manual run builds the same APK as an artifact only. Debug
# builds are local (release.sh --debug, scripts/emulator.sh).
# Repository secrets: HERBIER_SUPABASE_URL, HERBIER_SUPABASE_PUBLISHABLE_KEY,
# HERBIER_GOOGLE_WEB_CLIENT_ID, HERBIER_RELEASE_KEYSTORE_BASE64 (base64 of
# the keystore), HERBIER_RELEASE_KEYSTORE_PASSWORD, HERBIER_RELEASE_KEY_ALIAS,
# HERBIER_RELEASE_KEY_PASSWORD. No key rotation: the one release that moves
# an install off the debug key is built locally with release.sh; the ones
# after it, these included, need the release key alone (architecture §4).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; the job adds contents: write for `gh release
# create`, and checkout keeps no token, so npm and Gradle never see it.
permissions:
  contents: read

env:
  DUNE_CACHE: enabled
  DUNE_CACHE_ROOT: /home/runner/.cache/dune

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Actions pinned by commit (the job holds the release key), tag alongside.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # versionCode counts main's commits (origin/main), versionName is
          # git describe: the whole history, every branch.
          fetch-depth: 0
          persist-credentials: false
      - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3
        with:
          ocaml-compiler: "5.3"
          cache-prefix: v4-dune-ocamlformat
      - run: opam install -y dune ocamlformat.0.29.0
      - name: Cache dune's shared cache and the locked package builds
        # No _build/.db: dune's rule database without the rest of _build
        # makes it look for action outputs that are not there (as in ci.yml).
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/dune
            _build/_private
          key: dune-v2-${{ runner.os }}-${{ hashFiles('dune.lock/**') }}-${{ hashFiles('dune-project', '**/dune') }}
          restore-keys: |
            dune-v2-${{ runner.os }}-${{ hashFiles('dune.lock/**') }}-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HERBIER_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "the HERBIER_RELEASE_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Signed release APK
        env:
          HERBIER_SUPABASE_URL: ${{ secrets.HERBIER_SUPABASE_URL }}
          HERBIER_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.HERBIER_SUPABASE_PUBLISHABLE_KEY }}
          HERBIER_GOOGLE_WEB_CLIENT_ID: ${{ secrets.HERBIER_GOOGLE_WEB_CLIENT_ID }}
          HERBIER_RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          HERBIER_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.HERBIER_RELEASE_KEYSTORE_PASSWORD }}
          HERBIER_RELEASE_KEY_ALIAS: ${{ secrets.HERBIER_RELEASE_KEY_ALIAS }}
          HERBIER_RELEASE_KEY_PASSWORD: ${{ secrets.HERBIER_RELEASE_KEY_PASSWORD }}
          # The runner is thrown away: no daemon left behind.
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        # No .env.prod: release.sh takes the environment.
        run: opam exec -- scripts/release.sh
      - name: Name the APK
        # A branch name may hold a "/" (feat/...), not a file or artifact name.
        run: |
          echo "APK=herbier-${GITHUB_REF_NAME//\//-}.apk" >> "$GITHUB_ENV"
      - run: cp android/app/build/outputs/apk/release/app-release.apk "$APK"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}
          if-no-files-found: error
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$APK" --repo "$GITHUB_REPOSITORY" --generate-notes
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
