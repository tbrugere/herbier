name: android
# Debug APK for sideloading, on tags and on demand; the only device build until M8.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DUNE_CACHE: enabled
  DUNE_CACHE_ROOT: /home/runner/.cache/dune

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
          cache-prefix: v4-dune-ocamlformat
      - run: opam install -y dune ocamlformat.0.29.0
      - name: Cache dune's shared cache and the locked package builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/dune
            _build/_private
            _build/.db
          key: dune-${{ runner.os }}-${{ hashFiles('dune.lock/**') }}-${{ hashFiles('dune-project', '**/dune') }}
          restore-keys: |
            dune-${{ runner.os }}-${{ hashFiles('dune.lock/**') }}-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: opam exec -- dune build --profile release @web
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: herbier-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
