name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DUNE_CACHE: enabled
  DUNE_CACHE_ROOT: /home/runner/.cache/dune

jobs:
  ocaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
          cache-prefix: v4-dune-ocamlformat
      - run: opam install -y dune ocamlformat.0.29.0
      - name: Cache dune's shared cache and the locked package builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/dune
            _build/_private
            _build/.db
          key: dune-${{ runner.os }}-${{ hashFiles('dune.lock/**') }}-${{ hashFiles('dune-project', '**/dune') }}
          restore-keys: |
            dune-${{ runner.os }}-${{ hashFiles('dune.lock/**') }}-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: opam exec -- dune build
      - run: opam exec -- dune test
      - run: opam exec -- dune build @web
      - name: web shell contains the styled heading
        run: |
          cd _build/default/web/dist
          test -f index.html && test -f app.css && test -f vendor.js && test -f app.js
          grep -q '"Herbier"' app.js
          grep -q 'h1.title' app.css
          grep -q 'app.js' index.html
      - run: opam exec -- dune build @fmt
