name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DUNE_CACHE: enabled
  DUNE_CACHE_ROOT: /home/runner/.cache/dune

jobs:
  ocaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
          cache-prefix: v4-dune-ocamlformat
      - run: opam install -y dune ocamlformat.0.29.0
      - name: Cache dune's shared cache and the locked package builds
        uses: actions/cache@v4
        with:
          # Not _build/.db: restoring dune's rule database without the rest of
          # _build makes it look for action outputs that are not there
          # ("open(_build/.actions/...): No such file or directory").
          path: |
            ~/.cache/dune
            _build/_private
          key: dune-v2-${{ runner.os }}-${{ hashFiles('dune.lock/**') }}-${{ hashFiles('dune-project', '**/dune') }}
          restore-keys: |
            dune-v2-${{ runner.os }}-${{ hashFiles('dune.lock/**') }}-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: opam exec -- dune build
      - name: sqlite3 for test/store (with FTS5, for the search index)
        run: |
          command -v sqlite3 || (sudo apt-get update && sudo apt-get install -y sqlite3)
          sqlite3 :memory: 'pragma compile_options;' | grep -qx ENABLE_FTS5
      # Also fails when app/store/tables.ml is not what postgrest-codegen
      # generates from supabase/schema/catalog.json (the diff rule in
      # app/store/dune).
      # Also fails when a committed *.opam file is not what dune generates
      # from dune-project.
      - run: opam exec -- dune test
      - run: opam exec -- dune build @web
      - name: web bundle contains the app shell
        run: |
          cd _build/default/web/dist
          test -f index.html && test -f app.css && test -f vendor.js && test -f app.js
          grep -q 'shell__screen' app.js
          grep -q '\.shell' app.css
          grep -q 'app.js' index.html
      # The app's JS in the release profile (what release.sh ships as
      # app.js) links no dev page and no herbierDev hook.
      - name: release app has no dev pages
        run: |
          opam exec -- dune build --build-dir _build_release --profile release app/main.bc.js
          test -s _build_release/default/app/main.bc.js
          ! grep -q herbierDev _build_release/default/app/main.bc.js
      - run: opam exec -- dune build @fmt

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: astral-sh/setup-uv@v6
      - run: npx --no-install supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: schema dump is fresh
        run: uv run supabase/scripts/schema-dump.py --check
      - name: catalog is fresh
        run: scripts/catalog-dump.sh --check
      - name: triggers, plants_near and RLS answer on the seeded database
        run: psql -v ON_ERROR_STOP=1 postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/scripts/smoke.sql
      - if: always()
        run: npx --no-install supabase stop --no-backup
